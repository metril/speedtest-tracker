services:
  app:
    build: .
    image: ghcr.io/metril/speedtest-tracker:edge
    environment:
      ST_DB_PATH: /data/speedtest.db
      ST_LISTEN: 0.0.0.0:8080
    # Ships open by default (no auth). To put this instance behind a
    # reverse proxy doing forward auth, see the README's Authentication
    # section and uncomment the block below.
    # environment:
    #   ST_LOCK_ENV: "true"
    #   ST_AUTH_MODE: forward_auth
    #   ST_AUTH_USER_HEADER: Remote-User
    #   ST_AUTH_GROUPS_HEADER: Remote-Groups
    #   ST_AUTH_TRUSTED_PROXIES: '["172.16.0.0/12"]'
    #   ST_AUTH_ADMIN_GROUP: admins
    # Or OIDC:
    #   ST_AUTH_MODE: oidc
    #   ST_AUTH_OIDC_ISSUER: https://authelia.example.com
    #   ST_AUTH_OIDC_CLIENT_ID: speedtest-tracker
    #   ST_AUTH_OIDC_CLIENT_SECRET: changeme
    #   ST_AUTH_OIDC_ALLOWED_GROUPS: '["admins"]'
    ports: ["8080:8080"]
    volumes: ["speedtest-data:/data"]
    restart: unless-stopped

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.111.0
    profiles: ["observability"]
    command: ["-storageDataPath=/vmdata", "-retentionPeriod=12"]
    ports: ["8428:8428"]
    volumes: ["vm-data:/vmdata"]
    restart: unless-stopped

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.0.0-victorialogs
    profiles: ["observability"]
    command: ["-storageDataPath=/vldata", "-retentionPeriod=30d"]
    ports: ["9428:9428"]
    volumes: ["vl-data:/vldata"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability"]
    depends_on: [victoria-metrics]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports: ["3000:3000"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  speedtest-data:
  vm-data:
  vl-data:
  grafana-data:
