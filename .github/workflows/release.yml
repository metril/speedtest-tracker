name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      major: ${{ steps.rp.outputs.major }}
      minor: ${{ steps.rp.outputs.minor }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # 1. Open or refresh the release PR (changelog + manifest bump).
      - id: rp-pr
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skip-github-release: true

      # 2. Merge it straight away. A push made with GITHUB_TOKEN does not
      #    start another workflow run, so the release itself must be cut in
      #    this same run (step 3).
      - name: Merge release PR
        if: steps.rp-pr.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ fromJSON(steps.rp-pr.outputs.pr).number }}
        run: |
          set -eu
          for attempt in 1 2 3; do
            if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
          for _ in $(seq 1 12); do
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            [ "$state" = MERGED ] && exit 0
            sleep 5
          done
          echo "release PR #$PR did not reach MERGED" >&2
          exit 1

      # 3. Tag and publish the GitHub release for the merged release PR.
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skip-github-pull-request: true

  build:
    needs: release-please
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.sha }}
      # On a release run the checkout is the tagged commit, not github.sha,
      # so derive the sha tag and revision label from what was checked out.
      - id: src
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/metril/speedtest-tracker
          tags: |
            type=edge,branch=main
            type=raw,value=sha-${{ steps.src.outputs.short }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=raw,value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=raw,value=${{ needs.release-please.outputs.major }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.release-please.outputs.version || 'edge' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        run: make web-build
      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -eux
          name="speedtest-tracker_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${name}/speedtest-tracker" ./cmd/speedtest-tracker
          cp README.md CHANGELOG.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          gh release upload "v${VERSION}" \
            dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
